name: syllabus

services:
  db:
    container_name: syllabus-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # solo desde este equipo: DBeaver/pgAdmin o el backend con ./mvnw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [syllabus-net]

  # Solo en desarrollo (COMPOSE_PROFILES=dev): SMTP de prueba con bandeja web para la recuperación (UC2).
  mailpit:
    container_name: syllabus-mailpit
    image: axllent/mailpit
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [syllabus-net]

  # La aplicación completa: API Spring Boot y la interfaz Angular compilada, en un solo contenedor.
  app:
    container_name: syllabus-app
    build:
      context: .
      additional_contexts:
        frontend: ../syllabus-frontend # el repo del frontend, clonado junto a este
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-80}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [syllabus-net]

volumes:
  db-data:
  uploads:

networks:
  syllabus-net:
