spring:
  application:
    name: syllabus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/syllabus}
    username: ${POSTGRES_USER:syllabus}
    password: ${POSTGRES_PASSWORD:syllabus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  url: ${APP_URL:http://localhost}
  jwt:
    secret: ${JWT_SECRET}
    expires-in: ${JWT_EXPIRES_IN:8h}
  mail-from: ${MAIL_FROM:syllabus@autonoma.edu.co}
  password-reset-expires-in: ${PASSWORD_RESET_EXPIRES_IN:30m}
  # Logo institucional subido desde Configuración (volumen "uploads" en Docker).
  uploads-dir: ${UPLOADS_DIR:uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health
