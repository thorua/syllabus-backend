name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Pruebas (mvn verify con Testcontainers) e imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      # La imagen incluye la interfaz Angular: se compila con el repositorio del frontend.
      - uses: actions/checkout@v4
        with:
          repository: thorua/syllabus-frontend
          ref: ${{ github.head_ref || github.ref_name }}
          path: frontend
      - run: docker build --build-context frontend=frontend -t syllabus-app .
