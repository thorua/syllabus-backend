name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Pruebas (mvn verify con Testcontainers) e imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - run: docker build -t syllabus-backend .
